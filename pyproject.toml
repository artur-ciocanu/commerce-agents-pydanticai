[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commerce-agents-pydanticai"
version = "0.1.0"
description = "Provider-agnostic commerce agents built with PydanticAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.132",
  "jsonschema>=4.20",
  "pydantic>=2.12",
  "pydantic-ai>=2.0",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
